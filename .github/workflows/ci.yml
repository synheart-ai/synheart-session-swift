name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Read-only token: these jobs only check out, build and test.
permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: macos-latest

    strategy:
      matrix:
        swift: ['5.9']
        platform: ['iOS', 'macOS']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build (SPM)
        run: swift build

      - name: Run tests
        run: swift test

      - name: Pod lint
        run: pod lib lint --allow-warnings

  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml
